<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فرۆشگای ئاکام</title>
<meta name="theme-color" content="#0E1330">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;800&family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--ink:#0E1330;--ink2:#1D2559;--gold:#E3A72F;--gold-ink:#2A1D00;--goldsoft:#FFF3D1;--bg:#F4F5FA;--card:#FFFFFF;--line:#E3E6F0;--mute:#6A7090;--text:#0E1330;--ok:#15803D;--err:#C62828;--okbg:#E4F5EA;--errbg:#FDE8E8;--warnbg:#FFF3D1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090C20;--card:#131937;--line:#252D5C;--mute:#9AA1C8;--text:#EEF0FB;--goldsoft:#3A2E0E;--okbg:#10301E;--errbg:#3A1616;--warnbg:#3A2E0E;--ok:#5FD08A;--err:#FF8A80}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.7;font-size:16px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
.kufi{font-family:"Noto Kufi Arabic","Vazirmatn",sans-serif}

/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ink) 94%,transparent);backdrop-filter:blur(10px);color:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:8px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;padding:0}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-style:normal;font-weight:800}
.logo b{font-size:17px}
.hb{display:flex;gap:8px}
.ib{position:relative;height:40px;min-width:40px;padding:0 12px;border-radius:12px;border:1px solid #ffffff30;background:#ffffff12;color:#fff;display:flex;align-items:center;gap:6px;font-size:14px}
.ib svg{width:20px;height:20px}
.cnt{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--gold);color:var(--gold-ink);font-size:12px;font-weight:800;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}

/* hero */
.hero{background:radial-gradient(600px 300px at 15% 0%,#3b3fa855,transparent 70%),radial-gradient(500px 260px at 100% 100%,#E3A72F33,transparent 70%),linear-gradient(160deg,var(--ink),var(--ink2));color:#fff;padding:38px 0 44px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(30px,8vw,52px);line-height:1.25;margin:0 0 10px;font-weight:800}
.hero h1 span{color:var(--gold)}
.hero p{margin:0 0 22px;color:#C9CDEE;max-width:34ch;font-size:17px}
.cta{background:var(--gold);color:var(--gold-ink);border:0;border-radius:14px;padding:13px 26px;font-weight:800;font-size:16px}
.perks{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;color:#C9CDEE;font-size:14px}
.perks span{border:1px solid #ffffff2a;border-radius:999px;padding:3px 12px}

/* toolbar */
.bar{display:flex;gap:8px;margin:18px 0 12px;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 14px;font:inherit}
.chip{height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 14px;white-space:nowrap;font-weight:600}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
h2.t{font-size:20px;margin:6px 0 12px}

/* products */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:40px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #0e133022}}
.pic{position:relative;aspect-ratio:4/5;background:linear-gradient(135deg,var(--ink2),var(--ink));display:grid;place-items:center;color:var(--gold);font-size:56px;font-weight:800}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--gold);color:var(--gold-ink);font-style:normal;font-weight:800;font-size:13px;border-radius:999px;padding:2px 10px}
.sold{position:absolute;inset:0;background:#0e1330b8;color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{margin:0;font-size:16px}
.cb p{margin:0;color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.pr{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto;padding-top:6px}
.pr b{font-size:18px;display:block}
.pr s{color:var(--mute);font-size:13px}
.pr small{color:var(--mute);font-size:12px}
.add{width:42px;height:42px;border-radius:14px;border:0;background:var(--ink);color:var(--gold);font-size:24px;font-weight:600;line-height:1}
@media(prefers-color-scheme:dark){.add{background:var(--gold);color:var(--gold-ink)}}
.add:disabled{opacity:.35;cursor:not-allowed}
.empty{text-align:center;color:var(--mute);padding:40px 10px}

/* overlay / sheets */
.ov{position:fixed;inset:0;background:#070a1e99;z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}.card{transition:none}}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh h3{margin:0;font-size:19px}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:20px}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .th{width:52px;height:52px;border-radius:12px;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}
.line .th img{width:100%;height:100%;object-fit:cover}
.line .i{flex:1;min-width:0}
.line .i b{display:block;font-size:15px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:17px}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:19px;padding:14px 0 6px}
.btn{width:100%;border:0;border-radius:14px;background:var(--gold);color:var(--gold-ink);padding:15px;font-weight:800;font-size:17px}
.btn:disabled{opacity:.5}
.btn.sec{background:var(--bg);color:var(--text);border:1px solid var(--line);font-weight:600;margin-top:8px}
input.f,textarea.f{display:block;width:100%;margin-top:5px;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit}
input.f:focus,textarea.f:focus{border-color:var(--gold)}
.ltr{direction:ltr;text-align:right}
label.l{display:block;font-weight:600;font-size:14px;margin-bottom:12px}
textarea.f{min-height:76px;resize:vertical}
.err{color:var(--err);font-size:14px;min-height:22px;margin:4px 0}
.hint{color:var(--mute);font-size:13px;font-weight:400}

/* pages */
.page{display:none;padding:18px 0 60px;max-width:560px;margin:0 auto}
.page.on{display:block}
.back{background:none;border:0;color:var(--mute);padding:6px 0;font-weight:600}
.steps{display:flex;gap:6px;margin:6px 0 18px}
.steps div{flex:1;text-align:center;font-size:13px;color:var(--mute);border-top:4px solid var(--line);padding-top:6px;font-weight:600}
.steps div.on{color:var(--text);border-color:var(--gold)}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.box h3{margin:0 0 10px;font-size:17px}
.meths{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meth{border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;padding:12px 4px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:6px}
.meth i{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center;font-style:normal;font-size:14px}
.meth[aria-pressed="true"]{border-color:var(--gold);background:var(--goldsoft)}
.paybox{background:linear-gradient(160deg,var(--ink),var(--ink2));color:#fff;border-radius:18px;padding:18px;margin-bottom:14px}
.paybox small{color:#B9BEE6;display:block}
.paybox .am{font-size:28px;font-weight:800;color:var(--gold);line-height:1.3;margin:2px 0 12px}
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#ffffff14;border:1px dashed #ffffff55;border-radius:14px;padding:10px 12px}
.acct b{font-size:24px;letter-spacing:2px;direction:ltr;unicode-bidi:isolate}
.copy{background:var(--gold);color:var(--gold-ink);border:0;border-radius:10px;padding:8px 14px;font-weight:800}
.drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--mute);cursor:pointer;background:var(--bg)}
.drop img{max-width:100%;max-height:240px;border-radius:12px;display:block;margin:10px auto 0}
.done{text-align:center;padding:40px 10px}
.done .ck{width:84px;height:84px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}
.done .no{font-size:26px;font-weight:800;color:var(--gold);direction:ltr;unicode-bidi:isolate}
.ord{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ord .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:13px;font-weight:600;padding:2px 12px;border-radius:999px;background:var(--warnbg);color:var(--text)}
.badge.approved,.badge.shipped{background:var(--okbg);color:var(--ok)}
.badge.rejected{background:var(--errbg);color:var(--err)}
.ord ul{margin:8px 0;padding-inline-start:20px;color:var(--mute);font-size:14px}
.note{background:var(--errbg);color:var(--err);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:6px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:24px 0 36px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:#fff;border-radius:12px;padding:10px 18px;z-index:60;display:none;border:1px solid #ffffff25}
.toast.on{display:block}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
  <button class="logo" id="home" aria-label="سەرەکی"><i class="kufi">ئا</i><b class="kufi">فرۆشگای ئاکام</b></button>
  <div class="hb">
    <button class="ib" id="acc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span id="acct">چوونەژوورەوە</span></button>
    <button class="ib" id="cartb" aria-label="سەبەتە"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11h10L20 7H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg><span class="cnt" id="cnt" hidden>0</span></button>
  </div>
</div></header>

<!-- SHOP -->
<div id="p-shop">
  <div class="hero"><div class="wrap">
    <h1 class="kufi">ئاکام،<br><span>هەڵبژاردەی کەشخە</span></h1>
    <p>کاڵای جوان و باش، بە نرخێکی گونجاو. هەڵیبژێرە و پارەکەی بنێرە، ئێمە دەیگەیەنین.</p>
    <button class="cta" id="goshop">کاڵاکان ببینە</button>
    <div class="perks"><span>گەیاندن</span><span>داشکانی تایبەت</span><span>مێژووی کڕین پارێزراوە</span></div>
  </div></div>
  <div class="wrap" id="shopTop">
    <div class="bar">
      <div class="search"><input id="q" type="search" placeholder="بگەڕێ بۆ کاڵا..." aria-label="گەڕان"></div>
      <button class="chip" id="saleOnly" aria-pressed="false">داشکاندراو</button>
    </div>
    <div class="grid" id="grid"></div>
    <footer>فرۆشگای ئاکام</footer>
  </div>
</div>

<!-- CHECKOUT -->
<div class="wrap"><div class="page" id="p-checkout"></div></div>
<!-- ORDERS -->
<div class="wrap"><div class="page" id="p-orders"></div></div>
<!-- DONE -->
<div class="wrap"><div class="page" id="p-done"></div></div>

<!-- CART SHEET -->
<div class="ov" id="o-cart"><div class="sheet" role="dialog" aria-label="سەبەتە">
  <div class="sh"><h3>سەبەتەکەت</h3><button class="x" data-close aria-label="داخستن">×</button></div>
  <div id="cartBody"></div>
</div></div>

<!-- LOGIN SHEET -->
<div class="ov" id="o-login"><div class="sheet" role="dialog" aria-label="چوونەژوورەوە">
  <div class="sh"><h3>بچۆ ژوورەوە</h3><button class="x" data-close aria-label="داخستن">×</button></div>
  <p class="hint" style="margin-top:0">تەنیا ژمارەی مۆبایلەکەت بنووسە. ئەگەر ئەکاونتت نەبێت، خۆکارانە دروست دەبێت.</p>
  <label class="l">ژمارەی مۆبایل<input class="f ltr" id="phone" type="tel" inputmode="tel" placeholder="07501234567" autocomplete="tel"></label>
  <div class="err" id="lerr" role="alert"></div>
  <button class="btn" id="dologin">بەردەوامبە</button>
</div></div>

<!-- ACCOUNT SHEET -->
<div class="ov" id="o-acc"><div class="sheet" role="dialog" aria-label="ئەکاونت">
  <div class="sh"><h3>ئەکاونتەکەم</h3><button class="x" data-close aria-label="داخستن">×</button></div>
  <p style="margin:0 0 12px"><b class="ltr" id="aphone" style="display:inline-block"></b></p>
  <button class="btn" id="myorders">مێژووی کڕینەکانم</button>
  <button class="btn sec" id="logout">چوونەدەرەوە</button>
</div></div>

<div class="toast" id="toast" role="status"></div>

<script>
var $=function(i){return document.getElementById(i)};
var P=[],ACCOUNT="",ME=null,cart={},method="FIB",receipt="",afterLogin=null,onlySale=false;
try{cart=JSON.parse(localStorage.getItem("akam_cart")||"{}")}catch(e){cart={}}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){return Number(n).toLocaleString("en-US")}
function words(n){if(n<1000)return n+" دینار";var t=Math.floor(n/1000),r=n%1000;return t+" هەزار"+(r?" و "+r:"")+" دینار"}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("on")},2400)}
function api(path,body){
  var o=body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{};
  return fetch(path,o).then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||"هەڵە");e.status=r.status;throw e}return j})});
}
function saveCart(){try{localStorage.setItem("akam_cart",JSON.stringify(cart))}catch(e){}}
function lines(){
  var out=[];
  P.forEach(function(p){if(cart[p.id]>0&&p.inStock)out.push({p:p,q:cart[p.id]})});
  return out;
}
function total(){return lines().reduce(function(s,l){return s+l.p.final*l.q},0)}
function count(){return lines().reduce(function(s,l){return s+l.q},0)}

/* ---------- views ---------- */
function view(v){
  ["shop","checkout","orders","done"].forEach(function(x){
    var e=$("p-"+x);
    if(x==="shop")e.hidden=(v!=="shop");else e.classList.toggle("on",v===x);
  });
  window.scrollTo(0,0);
}
function openO(id){$(id).classList.add("on")}
function closeO(){document.querySelectorAll(".ov").forEach(function(o){o.classList.remove("on")})}
document.addEventListener("click",function(e){
  if(e.target.closest("[data-close]")||e.target.classList.contains("ov"))closeO();
});

/* ---------- shop ---------- */
function drawShop(){
  var q=$("q").value.trim().toLowerCase();
  var list=P.filter(function(p){return (!q||p.name.toLowerCase().indexOf(q)>-1)&&(!onlySale||p.discount>0)});
  if(!list.length){$("grid").innerHTML='<div class="empty" style="grid-column:1/-1">هیچ کاڵایەک نەدۆزرایەوە</div>';return}
  $("grid").innerHTML=list.map(function(p){
    var pic=p.img?'<img loading="lazy" src="'+esc(p.img)+'" alt="">':esc(p.name.charAt(0));
    return '<article class="card"><div class="pic">'+pic+
      (p.discount?'<i class="tag"><bdi>'+p.discount+'%</bdi> داشکان</i>':'')+
      (!p.inStock?'<div class="sold">نەماوە</div>':'')+'</div>'+
      '<div class="cb"><h3>'+esc(p.name)+'</h3><p>'+esc(p.desc)+'</p>'+
      '<div class="pr"><div><b>'+fmt(p.final)+' <small>دینار</small></b>'+(p.discount?'<s>'+fmt(p.price)+'</s>':'')+'</div>'+
      '<button class="add" data-add="'+p.id+'" aria-label="زیادکردن بۆ سەبەتە"'+(p.inStock?'':' disabled')+'>+</button></div></div></article>';
  }).join("");
}
$("grid").addEventListener("click",function(e){
  var b=e.target.closest("[data-add]");if(!b)return;
  cart[b.dataset.add]=(cart[b.dataset.add]||0)+1;saveCart();drawCart();toast("زیادکرا بۆ سەبەتە");
});
$("q").addEventListener("input",drawShop);
$("saleOnly").addEventListener("click",function(){onlySale=!onlySale;this.setAttribute("aria-pressed",onlySale);drawShop()});
$("goshop").addEventListener("click",function(){$("shopTop").scrollIntoView()});
$("home").addEventListener("click",function(){view("shop")});

/* ---------- cart ---------- */
function drawCart(){
  var c=count();
  $("cnt").hidden=!c;$("cnt").textContent=c;
  var L=lines(),h="";
  if(!L.length){h='<div class="empty">سەبەتەکەت بەتاڵە</div>'}
  else{
    h=L.map(function(l){
      return '<div class="line"><div class="th">'+(l.p.img?'<img src="'+esc(l.p.img)+'" alt="">':esc(l.p.name.charAt(0)))+'</div>'+
      '<div class="i"><b>'+esc(l.p.name)+'</b><span class="hint">'+fmt(l.p.final)+' دینار</span></div>'+
      '<div class="qty"><button data-q="'+l.p.id+'" data-d="1" aria-label="زیادکردن">+</button><b>'+l.q+'</b><button data-q="'+l.p.id+'" data-d="-1" aria-label="کەمکردن">−</button></div></div>';
    }).join("")+'<div class="tot"><span>کۆی گشتی</span><span>'+fmt(total())+' دینار</span></div>'+
    '<button class="btn" id="tocheckout">تەواوکردنی کڕین</button>';
  }
  $("cartBody").innerHTML=h;
}
$("cartBody").addEventListener("click",function(e){
  var b=e.target.closest("[data-q]");
  if(b){var id=b.dataset.q;cart[id]=Math.max(0,(cart[id]||0)+Number(b.dataset.d));if(!cart[id])delete cart[id];saveCart();drawCart();return}
  if(e.target.id==="tocheckout"){closeO();needLogin(function(){showCheckout()})}
});
$("cartb").addEventListener("click",function(){drawCart();openO("o-cart")});

/* ---------- auth ---------- */
function drawAcc(){$("acct").textContent=ME?ME.phone.slice(0,4)+"…"+ME.phone.slice(-3):"چوونەژوورەوە"}
function needLogin(cb){
  if(ME){cb();return}
  afterLogin=cb;$("lerr").textContent="";openO("o-login");setTimeout(function(){$("phone").focus()},120);
}
$("dologin").addEventListener("click",function(){
  var b=this;b.disabled=true;$("lerr").textContent="";
  api("/api/auth",{action:"login",phone:$("phone").value}).then(function(j){
    ME=j.user;drawAcc();closeO();toast("بەخێربێیت");
    var cb=afterLogin;afterLogin=null;if(cb)cb();
  }).catch(function(e){$("lerr").textContent=e.message}).then(function(){b.disabled=false});
});
$("phone").addEventListener("keydown",function(e){if(e.key==="Enter")$("dologin").click()});
$("acc").addEventListener("click",function(){
  if(!ME){needLogin(function(){});return}
  $("aphone").textContent=ME.phone;openO("o-acc");
});
$("logout").addEventListener("click",function(){
  api("/api/auth",{action:"logout"}).then(function(){ME=null;drawAcc();closeO();view("shop");toast("چوویتە دەرەوە")});
});
$("myorders").addEventListener("click",function(){closeO();showOrders()});

/* ---------- checkout ---------- */
function compress(file){
  return new Promise(function(ok,no){
    var img=new Image();
    img.onload=function(){
      var k=Math.min(1,1200/Math.max(img.width,img.height));
      var c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      ok(c.toDataURL("image/jpeg",0.72));
    };
    img.onerror=function(){no(new Error("img"))};
    img.src=URL.createObjectURL(file);
  });
}
function showCheckout(){
  var L=lines();
  if(!L.length){toast("سەبەتەکەت بەتاڵە");return}
  var t=total();
  receipt="";
  var names={"FIB":"FIB","FastPay":"FastPay","کی کارد":"QiCard"};
  var h='<button class="back" id="bk">‹ گەڕانەوە بۆ کاڵاکان</button>'+
  '<div class="steps"><div class="on">١. سەبەتە</div><div class="on">٢. پارەدان</div><div class="on">٣. وەسڵ</div></div>'+
  '<div class="box"><h3>کاڵاکانت</h3>'+L.map(function(l){return '<div class="line"><div class="i"><b>'+esc(l.p.name)+'</b><span class="hint">'+l.q+' × '+fmt(l.p.final)+'</span></div><b>'+fmt(l.p.final*l.q)+'</b></div>'}).join("")+
  '<div class="tot"><span>کۆی گشتی</span><span>'+fmt(t)+' دینار</span></div></div>'+
  '<div class="box"><h3>ڕێگای پارەدان</h3><div class="meths">'+["FIB","FastPay","کی کارد"].map(function(m){
    return '<button class="meth" data-m="'+m+'" aria-pressed="'+(m===method)+'"><i>'+esc(names[m].charAt(0))+'</i>'+esc(m)+'</button>'}).join("")+'</div></div>'+
  '<div class="paybox"><small>ئەم بڕە بنێرە بۆ ئەم ژمارەیە لە ڕێگەی <b id="mn">'+esc(method)+'</b></small><div class="am">'+words(t)+'</div>'+
  '<div class="acct"><b>'+esc(ACCOUNT)+'</b><button class="copy" id="copy" type="button">کۆپی</button></div></div>'+
  '<div class="box"><h3>وەسڵ و زانیاری</h3>'+
  '<label class="drop" for="rec"><span id="rtxt">دوای پارەناردن، وێنەی وەسڵەکە لێرە هەڵبژێرە</span><img id="rprev" alt="" hidden></label><input id="rec" type="file" accept="image/*" hidden><div style="height:14px"></div>'+
  '<label class="l">ژمارەی هەژماری خۆت <span class="hint">(ئەوەی پارەکەی پێ ناردووە)</span><input class="f ltr" id="payer" inputmode="numeric" autocomplete="off"></label>'+
  '<label class="l">ناوی تەواو<input class="f" id="nm" autocomplete="name" value="'+esc(ME.name)+'"></label>'+
  '<label class="l">ناونیشان<textarea class="f" id="ad" autocomplete="street-address">'+esc(ME.address)+'</textarea></label>'+
  '<div class="err" id="cerr" role="alert"></div>'+
  '<button class="btn" id="send">ناردنی داواکاری · '+fmt(t)+' دینار</button></div>';
  $("p-checkout").innerHTML=h;view("checkout");
}
$("p-checkout").addEventListener("click",function(e){
  var m=e.target.closest("[data-m]");
  if(m){method=m.dataset.m;$("p-checkout").querySelectorAll("[data-m]").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.m===method)});$("mn").textContent=method;return}
  if(e.target.id==="bk"){view("shop");return}
  if(e.target.id==="copy"){
    var b=e.target;function ok(){b.textContent="کۆپی کرا";setTimeout(function(){b.textContent="کۆپی"},1500)}
    try{navigator.clipboard.writeText(ACCOUNT).then(ok,ok)}catch(x){ok()}return}
  if(e.target.id==="send")submit(e.target);
});
$("p-checkout").addEventListener("change",function(e){
  if(e.target.id!=="rec"||!e.target.files[0])return;
  compress(e.target.files[0]).then(function(d){
    receipt=d;$("rprev").src=d;$("rprev").hidden=false;$("rtxt").textContent="گۆڕینی وێنە";
  }).catch(function(){$("cerr").textContent="وێنەکە نەکرایەوە، وێنەیەکی تر هەڵبژێرە"});
});
function submit(btn){
  var msg="";
  var payer=$("payer").value.trim(),nm=$("nm").value.trim(),ad=$("ad").value.trim();
  if(!receipt)msg="وێنەی وەسڵ بار بکە.";
  else if(!/^[0-9]{6,20}$/.test(payer))msg="ژمارەی هەژمار بە ژمارەی ئینگلیزی بنووسە.";
  else if(!nm)msg="ناوی تەواو بنووسە.";
  else if(!ad)msg="ناونیشان بنووسە.";
  $("cerr").textContent=msg;if(msg)return;
  btn.disabled=true;var old=btn.textContent;btn.textContent="دەنێردرێت...";
  api("/api/orders",{
    items:lines().map(function(l){return{id:l.p.id,q:l.q}}),method:method,receipt:receipt,payer_account:payer,name:nm,address:ad
  }).then(function(j){
    ME.name=nm;ME.address=ad;cart={};saveCart();drawCart();
    $("p-done").innerHTML='<div class="done"><div class="ck"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>'+
      '<h2 class="kufi">داواکارییەکەت وەرگیرا</h2><p class="hint">ژمارەی داواکاری</p><div class="no">'+esc(j.order_no)+'</div>'+
      '<p>پارەدانەکەت دەپشکنرێت و دوای پەسەندکردن کاڵاکەت دەنێردرێت.</p>'+
      '<button class="btn" id="d1">مێژووی کڕینەکانم</button><button class="btn sec" id="d2">گەڕانەوە بۆ فرۆشگا</button></div>';
    view("done");
  }).catch(function(e){
    $("cerr").textContent=e.message;
    if(e.status===401){ME=null;drawAcc();needLogin(function(){showCheckout()})}
  }).then(function(){btn.disabled=false;btn.textContent=old});
}
$("p-done").addEventListener("click",function(e){
  if(e.target.id==="d1")showOrders();if(e.target.id==="d2")view("shop");
});

/* ---------- orders history ---------- */
var ST={pending:"چاوەڕێی پشکنین",approved:"پەسەندکرا",shipped:"نێردرا",rejected:"ڕەتکرایەوە"};
function showOrders(){
  $("p-orders").innerHTML='<button class="back" id="ob">‹ گەڕانەوە</button><h2 class="kufi">مێژووی کڕینەکانم</h2><div id="ol"><div class="empty">...</div></div>';
  view("orders");
  api("/api/orders").then(function(j){
    $("ol").innerHTML=j.orders.length?j.orders.map(function(o){
      return '<div class="ord"><div class="top"><b class="ltr">'+esc(o.no)+'</b><span class="badge '+o.status+'">'+ST[o.status]+'</span></div>'+
      '<div class="hint">'+new Date(o.created).toLocaleDateString("en-GB")+' · '+esc(o.method)+'</div>'+
      '<ul>'+o.items.map(function(i){return '<li>'+esc(i.name)+' × '+i.q+'</li>'}).join("")+'</ul>'+
      '<b>'+fmt(o.total)+' دینار</b>'+(o.status==="rejected"&&o.note?'<div class="note">'+esc(o.note)+'</div>':'')+'</div>';
    }).join(""):'<div class="empty">هێشتا هیچ کڕینێکت نییە</div>';
  }).catch(function(e){$("ol").innerHTML='<div class="empty">'+esc(e.message)+'</div>'});
}
$("p-orders").addEventListener("click",function(e){if(e.target.id==="ob")view("shop")});

/* ---------- start ---------- */
Promise.all([api("/api/store"),api("/api/auth")]).then(function(r){
  P=r[0].products;ACCOUNT=r[0].account;ME=r[1].user;
  drawAcc();drawShop();drawCart();
}).catch(function(e){
  $("grid").innerHTML='<div class="empty" style="grid-column:1/-1">'+esc(e.message||"نەتوانرا باربکرێت")+'</div>';
});
</script>
